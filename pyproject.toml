[project]
name = "clif-deid"
version = "0.1.0"
description = "Config-driven de-identification for CLIF Parquet tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.30.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
clif-deid = "clif_deid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clif_deid"]
